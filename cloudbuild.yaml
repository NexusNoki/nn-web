# Cloud Build: runs on every push to the public `site` branch and deploys
# https://www.nexnok.com (Firebase Hosting site "nexnok").
steps:
  - id: build
    name: alpine:3.20
    entrypoint: sh
    args: ["-ec", "./build.sh"]
  - id: deploy
    name: node:20-slim
    entrypoint: sh
    args: ["-ec", "npx -y firebase-tools@13 deploy --only hosting --project $PROJECT_ID --non-interactive"]
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 600s
